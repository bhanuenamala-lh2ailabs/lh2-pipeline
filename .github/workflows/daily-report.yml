name: Daily Supply Funnel Report

# Emails the three tracker tables — Role Definition, Individual targets, August Sprint —
# filled from live HubSpot.
#
# Deliberately SEPARATE from the dashboard deploy, so it has its own Run workflow button and
# can be sent on demand without redeploying the site. It pulls its own fresh data rather than
# depending on the dashboard run, which means the button always produces a correct email even
# if the dashboard has not refreshed.
#
# Required secrets: HUBSPOT_API_KEY, GMAIL_TOKEN_JSON, GMAIL_CLIENT_JSON

on:
  workflow_dispatch:
    inputs:
      to:
        description: "Send to (blank = Shobit)"
        required: false
        default: ""
      dry_run:
        description: "Build the report but do not send"
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "0 13 * * *"     # 18:30 IST — day close

permissions:
  contents: read

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Google client libraries
        run: pip install -q google-auth google-auth-oauthlib google-api-python-client

      - name: Pull fresh HubSpot data
        env:
          HUBSPOT_API_KEY: ${{ secrets.HUBSPOT_API_KEY }}
        run: python dashboard/build_dashboard.py

      - name: Write Gmail credentials
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          GMAIL_CLIENT_JSON: ${{ secrets.GMAIL_CLIENT_JSON }}
        run: |
          if [ -z "$GMAIL_TOKEN_JSON" ] || [ -z "$GMAIL_CLIENT_JSON" ]; then
            echo "::error::GMAIL_TOKEN_JSON / GMAIL_CLIENT_JSON not set — cannot send."
            exit 1
          fi
          printf '%s' "$GMAIL_TOKEN_JSON"  > dashboard/gmail_token.json
          printf '%s' "$GMAIL_CLIENT_JSON" > dashboard/gmail_oauth_client.json

      - name: Build and send the report
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" != "true" ]; then ARGS="--send"; fi
          if [ -n "${{ inputs.to }}" ]; then ARGS="$ARGS --to ${{ inputs.to }}"; fi
          python dashboard/daily_report.py $ARGS

      - name: Upload the rendered report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-report-html
          path: dashboard/daily_report.html
          if-no-files-found: warn

      # Credentials must never survive the job, even on failure.
      - name: Shred credentials
        if: always()
        run: rm -f dashboard/gmail_token.json dashboard/gmail_oauth_client.json
