name: Nightly Enrich + Sync

on:
  # PAUSED (2026-07-15): pilot runs are driven LOCALLY until the trial ends —
  # a scheduled CI run would double-spend SignalHire credits against a separate
  # cached DB. Re-enable by uncommenting the schedule (and seed the CI DB cache).
  # schedule:
  #   - cron: "30 18 * * *"   # 18:30 UTC = 00:00 IST
  workflow_dispatch: {}      # manual "Run workflow" button only

jobs:
  enrich-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('**/pyproject.toml', '**/requirements*.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: |
          pip install -e ".[all]"
          python -m playwright install chromium

      - name: Restore pipeline database
        # Carries the SQLite DB (companies + cache + quota ledger) between runs so
        # enrichment is incremental and never re-bills cached work. NOTE: the DB is
        # gitignored, so the very first run starts empty — seed it by running
        # `lh2 crawl && lh2 build` once (locally or via a bootstrap dispatch).
        uses: actions/cache@v4
        with:
          path: data/pipeline.sqlite
          key: pipeline-db-${{ github.run_id }}
          restore-keys: pipeline-db-

      - name: Create data directories
        run: mkdir -p data/exports data/raw_html

      - name: Bootstrap DB if missing
        # First dispatch (or expired cache): no DB yet -> seed it with crawl + build.
        # Subsequent runs restore the DB from cache and skip straight to enrich.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ ! -f data/pipeline.sqlite ]; then
            echo "No cached DB found — bootstrapping with crawl + build"
            lh2 crawl
            lh2 build
          else
            echo "DB restored from cache — skipping bootstrap"
          fi

      - name: Run enrichment + scoring
        # No firm cap here: the monthly credit budget (config providers.signalhire.
        # monthly_credit_budget = 4000) paces enrichment to its fair daily share
        # (~remaining/days-left), so it spends up to 4000/month spread across days.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SIGNALHIRE_API_KEY: ${{ secrets.SIGNALHIRE_API_KEY }}
        run: |
          lh2 enrich
          lh2 score

      - name: Sync to Google Sheets
        # sheets_sync reads these env vars directly (creds from the JSON string,
        # key from GOOGLE_SHEETS_KEY) — no file needed on the runner.
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEETS_KEY: ${{ secrets.GOOGLE_SHEETS_KEY }}
        run: lh2 sync

      - name: Sync to HubSpot
        # Companies + Contacts upserted (unique keys); Deals created at "New Lead"
        # only for firms that don't have one yet (existing deals never touched).
        env:
          HUBSPOT_API_KEY: ${{ secrets.HUBSPOT_API_KEY }}
        run: lh2 hubspot-sync

      - name: Save pipeline database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/pipeline.sqlite
          key: pipeline-db-${{ github.run_id }}

      - name: Export CSV backup
        run: lh2 export --hyperlinked

      - name: Upload export artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-export-${{ github.run_id }}
          path: data/exports/
          retention-days: 30
